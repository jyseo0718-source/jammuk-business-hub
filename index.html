<section class="page" id="budget"><div class="card"><h2>예산/교통비</h2><div class="grid"><div class="stat"><div class="lab">예상 사용</div><div class="val" id="usedAmt">₩0</div></div><div class="stat"><div class="lab">엔화 환산</div><div class="val" id="usedYen">¥0</div></div></div><div id="budgetList" style="margin-top:12px"></div><div class="sectionTitle">지출 추가</div><div class="field"><input id="bName" placeholder="항목명 예: 점심"></div><div class="grid"><input id="bKrw" type="number" placeholder="원화"><input id="bYen" type="number" placeholder="엔화"></div><button class="btn" style="width:100%;margin-top:10px" onclick="addBudget()">+ 추가</button></div></section>
<section class="page" id="report"><div class="card"><h2>출장 보고서</h2><div id="reportLines"></div></div><div class="card"><h2>관심 업체 TOP</h2><div id="topCompanies"></div></div><button class="btn" style="width:calc(100% - 28px);margin:0 14px" onclick="window.print()">PDF 저장/인쇄</button></section>
</main>
<nav class="nav"><button class="on" onclick="go('home',this)"><span class="ic">🏠</span>홈</button><button onclick="go('schedule',this)"><span class="ic">📅</span>일정</button><button onclick="go('companies',this)"><span class="ic">🏢</span>업체</button><button onclick="go('check',this)"><span class="ic">✅</span>체크</button><button onclick="go('budget',this)"><span class="ic">💴</span>예산</button><button onclick="go('report',this)"><span class="ic">📊</span>보고서</button></nav>

function won(n){return '₩'+Math.round(n||0).toLocaleString('ko-KR')}function yen(n){return '¥'+Math.round(n||0).toLocaleString('ko-KR')}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function go(p,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(p).classList.add('on');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderAll();window.scrollTo(0,0)}
function todayDay(){let now=new Date(),d=new Date(2026,5,24);if(now<d)return'6/24';if(now<=new Date(2026,5,24,23,59))return'6/24';if(now<=new Date(2026,5,25,23,59))return'6/25';return'6/26'}
function rowSchedule(s){return `<div class="item ${s.done?'done':''}"><div class="row"><span class="time">${esc(s.time)}</span><button class="box ${s.done?'on':''}" onclick="toggleSched('${s.id}')">${s.done?'✓':''}</button></div><div class="name">${icon(s.type)} ${esc(s.name)}</div><div class="meta">${esc(s.note)}</div><div class="tools">${s.map?`<a class="map" target="_blank" href="${s.map}">📍 지도</a>`:''}</div></div>`}
function icon(t){return{flight:'✈️',move:'🚇',hotel:'🏨',meal:'🍴',visit:'📍',expo:'🏢'}[t]||'•'}
function renderHome(){let trip=new Date(2026,5,24),now=new Date(),d=Math.ceil((trip-now)/(864e5));document.getElementById('dday').textContent=d>0?d+'일 남음':d===0?'D-DAY':'출장 진행/완료';document.getElementById('ddayPill').textContent=d>0?'D-'+d:d===0?'D-DAY':'DONE';let td=todayDay();let today=state.schedule.filter(s=>s.day===td);document.getElementById('todayCnt').textContent=today.length;document.getElementById('companyCnt').textContent=state.companies.length;document.getElementById('memoCnt').textContent=state.companies.filter(c=>c.memo||c.idea).length;document.getElementById('doneCnt').textContent=state.schedule.filter(s=>s.done).length;document.getElementById('todayTitle').textContent=td+' 일정';document.getElementById('todayList').innerHTML=today.map(rowSchedule).join('')||'<div class="empty">일정 없음</div>'}
function setDay(d,b){state.day=d;document.querySelectorAll('#daySeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderSchedule();save()}function renderSchedule(){document.getElementById('scheduleList').innerHTML=state.schedule.filter(s=>s.day===state.day).map(rowSchedule).join('')}function toggleSched(i){let s=state.schedule.find(x=>x.id===i);s.done=!s.done;renderAll();save()}
function setCat(c,b){state.cat=c;document.querySelectorAll('#catSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderCompanies();save()}function renderCompanies(){let q=document.getElementById('q')?.value?.toLowerCase()||'';let list=state.companies.filter(c=>{let text=(c.name+' '+c.cat+' '+c.memo+' '+c.idea).toLowerCase();let cat=state.cat==='all'||(state.cat==='fav'?c.fav:text.includes(state.cat.toLowerCase()));return cat&&text.includes(q)});document.getElementById('companyList').innerHTML=list.map(c=>`<div class="item" onclick="openCompany('${c.id}')"><div class="row"><div><span class="pill ${'tag'+c.priority}">${c.priority}</span><span class="pill">${esc(c.cat)}</span></div><button class="fav ${c.fav?'on':''}" onclick="event.stopPropagation();toggleFav('${c.id}')">★</button></div><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.memo||'메모 없음')}</div><div class="tools"><span class="map">사진 ${(c.photos||[]).length}</span><span class="map">MOQ ${esc(c.moq||'-')}</span></div></div>`).join('')||'<div class="empty">업체 없음</div>'}
function openCompany(i){currentId=i;let c=state.companies.find(x=>x.id===i);document.getElementById('mName').textContent=c.name;document.getElementById('mMeta').textContent=(c.cat||'')+(c.booth?' · 부스 '+c.booth:'');document.getElementById('mFav').classList.toggle('on',!!c.fav);document.getElementById('mMap').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.name+' Tokyo Big Sight');['Contact','Email','Moq','Price','Memo','Idea','Priority'].forEach(k=>{let el=document.getElementById('m'+k);if(el)el.value=c[k.toLowerCase()]||''});renderPhotos(c);document.getElementById('modal').classList.add('on')}function closeModal(){document.getElementById('modal').classList.remove('on');currentId=null}function updateCompany(k,v){let c=state.companies.find(x=>x.id===currentId);c[k]=v;renderCompanies();renderReport();save()}function toggleFav(i){let c=state.companies.find(x=>x.id===i);c.fav=!c.fav;renderCompanies();if(currentId===i)document.getElementById('mFav')?.classList.toggle('on',c.fav);save()}
function renderPhotos(c){document.getElementById('photoGrid').innerHTML=(c.photos||[]).map(p=>`<img class="photo" src="${p}">`).join('')}function addPhoto(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{let c=state.companies.find(x=>x.id===currentId);c.photos=c.photos||[];c.photos.push(e.target.result);renderPhotos(c);save()};r.readAsDataURL(f);input.value=''}
function setCheck(tab,b){state.checkTab=tab;document.querySelectorAll('#check .seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderCheck();save()}function renderCheck(){let a=state.checks[state.checkTab];document.getElementById('checkList').innerHTML=a.map((c,i)=>`<div class="chkrow"><button class="box ${c.d?'on':''}" onclick="toggleCheck(${i})">${c.d?'✓':''}</button><div class="txt ${c.d?'done':''}">${esc(c.t)}</div></div>`).join('')}function toggleCheck(i){state.checks[state.checkTab][i].d=!state.checks[state.checkTab][i].d;renderAll();save()}function addCheck(){let v=document.getElementById('newCheck').value.trim();if(!v)return;state.checks[state.checkTab].push({t:v,d:false});document.getElementById('newCheck').value='';renderCheck();save()}
function renderBudget(){let krw=0,y=0;state.budget.forEach(b=>{krw+=+b.krw||0;y+=+b.yen||0});document.getElementById('usedAmt').textContent=won(krw+y*state.rate);document.getElementById('usedYen').textContent=yen(y);document.getElementById('budgetList').innerHTML=state.budget.map(b=>`<div class="item"><div class="row"><div><div class="name">${esc(b.name)}</div><div class="meta">${won(b.krw)} ${b.yen?'/ '+yen(b.yen):''}</div></div><button class="btn ghost small" onclick="delBudget('${b.id}')">삭제</button></div></div>`).join('')}function addBudget(){let n=document.getElementById('bName').value.trim();if(!n)return;state.budget.push({id:id(),name:n,krw:+document.getElementById('bKrw').value||0,yen:+document.getElementById('bYen').value||0});document.getElementById('bName').value='';document.getElementById('bKrw').value='';document.getElementById('bYen').value='';renderBudget();save()}function delBudget(i){state.budget=state.budget.filter(b=>b.id!==i);renderBudget();save()}
function renderReport(){let done=state.schedule.filter(s=>s.done).length;let checks=Object.values(state.checks).flat();let cd=checks.filter(c=>c.d).length;let photos=state.companies.reduce((s,c)=>s+(c.photos||[]).length,0);document.getElementById('reportLines').innerHTML=`<div class="reportLine"><span>방문 일정 완료</span><b>${done}/${state.schedule.length}</b></div><div class="reportLine"><span>등록 업체</span><b>${state.companies.length}</b></div><div class="reportLine"><span>관심 업체</span><b>${state.companies.filter(c=>c.fav).length}</b></div><div class="reportLine"><span>사진</span><b>${photos}장</b></div><div class="reportLine"><span>체크리스트</span><b>${cd}/${checks.length}</b></div>`;document.getElementById('topCompanies').innerHTML=state.companies.filter(c=>c.fav||c.priority==='P1').slice(0,8).map(c=>`<div class="item"><span class="pill ${'tag'+c.priority}">${c.priority}</span><div class="name">${esc(c.name)}</div><div class="meta">${esc(c.memo||'')}</div></div>`).join('')}
function renderAll(){renderHome();renderSchedule();renderCompanies();renderCheck();renderBudget();renderReport()}
load().then(renderAll);
</script>
</body>
</html>
